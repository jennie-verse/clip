name: Test and deploy Clip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test tests/*.test.cjs
      - run: node --check app.js && node --check sw.js

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Stage public runtime files
        run: |
          mkdir public
          cp .nojekyll README.md app.css app.js index.html manifest.webmanifest sw.js public/
          cp -R assets docs icons licenses public/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Wait until the Pages artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # deploy-pages looks the artifact up right after the upload and fails with
          # "Found 0 artifact(s)" while GitHub's artifact listing lags behind (seen 2026-11-19).
          for i in $(seq 1 20); do
            n="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.total_count' 2>/dev/null || echo 0)"
            if [ "$n" -ge 1 ] 2>/dev/null; then echo "Artifact listed after $(( (i - 1) * 3 )) s"; exit 0; fi
            sleep 3
          done
          echo "Artifact still not listed after 60 s; deploying anyway."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
